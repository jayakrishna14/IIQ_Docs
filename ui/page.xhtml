<!DOCTYPE html PUBLIC
  "-//W3C//DTD XHTML 1.0 Transitional//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets">
<body>


<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                template="/identityiq/ui/default.xhtml">

  <ui:define name="title">Database Viewer</ui:define>

  <ui:define name="body">
    <h:form id="form">
      <h2>Database Records</h2>
      <div id="dataContainer"></div>
    </h:form>

    <script>
      fetch('/identityiq/plugin/rest/TodoPlugin/IIQRequests')
        .then(res => res.json())
        .then(data => {
          let html = '<table border="1" cellpadding="5"><tr>';
          if (data.length > 0) {
            Object.keys(data[0]).forEach(key => html += `<th>${key}</th>`);
            html += '</tr>';
            data.forEach(row => {
              html += '<tr>';
              Object.values(row).forEach(val => html += `<td>${val || ''}</td>`);
              html += '</tr>';
            });
          } else {
            html += '<tr><td>No records found</td></tr>';
          }
          html += '</table>';
          document.getElementById('dataContainer').innerHTML = html;
        })
        .catch(err => document.getElementById('dataContainer').innerHTML = 'Error loading data');
    </script>
  </ui:define>
</ui:composition>

</body>
</html>
